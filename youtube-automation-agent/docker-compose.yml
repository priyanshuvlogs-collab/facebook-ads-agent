services:
  postgres:
    image: postgres:16-alpine
    container_name: yta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yta
      POSTGRES_PASSWORD: yta
      POSTGRES_DB: yta
    ports:
      - "5432:5432"
    volumes:
      - yta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yta -d yta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yta_pgdata:
